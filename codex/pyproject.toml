[project]
name = "obsidian-research-mcp"
version = "0.1.0"
description = "MCP server giving ChatGPT (or any MCP client) the same 'research handle' as the Claude /research skill: ingest papers into a shared Obsidian vault as structured, connection-graph-rich summaries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ai-math-edu-lab" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
obsidian-research-mcp = "obsidian_research_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_research_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
